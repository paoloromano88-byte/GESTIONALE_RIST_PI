<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title id="page-title">Delivery Fattorini</title>
    <link rel="icon" href="data:,">
    <link rel="apple-touch-icon" href="logo.png">
    <!-- Su iPhone le notifiche arrivano solo all'app aggiunta alla schermata Home -->
    <link rel="manifest" href="delivery.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="sanitize.js"></script>
    <style>
        :root {
            --bg-dark: #0b1120;
            --panel-bg: #1e293b;
            --border-col: #334155;
            --primary: #3b82f6;
            --free: #10b981;
            --occupied: #ef4444;
            --reserved: #f59e0b;
            --ready: #00e676;
            --gold: #fbbf24;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark); color: #f8fafc;
            height: 100vh; height: 100dvh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* TOP BAR */
        .top-bar {
            background: #090d16; border-bottom: 1px solid var(--border-col);
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100;
        }
        .brand-title { font-weight: 900; font-size: 1.1em; color: var(--gold); display: flex; align-items: center; gap: 8px; }
        .ready-badge {
            display: none; background: #16a34a; color: #fff; padding: 6px 12px; border-radius: 20px;
            font-size: 0.82em; font-weight: 900; cursor: pointer; animation: lampeggia 1.2s ease-in-out infinite;
        }
        @keyframes lampeggia { 50% { opacity: 0.55; } }
        .kitchen-tag { font-size: 0.75em; padding: 3px 8px; border-radius: 6px; font-weight: 800; }
        /* Invito ad attivare le notifiche push (avviso "pronto" con l'app chiusa) */
        .banner-notifiche {
            display: none; align-items: center; gap: 10px; padding: 10px 16px; flex-shrink: 0;
            background: #1e3a8a; color: #e0e7ff; font-size: 0.85em; font-weight: 700; border-bottom: 1px solid #3b82f6;
        }
        .banner-notifiche span { flex: 1; line-height: 1.3; }
        .banner-notifiche button { background: #fbbf24; color: #111; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 900; cursor: pointer; flex-shrink: 0; }
        .driver-badge {
            background: #1e293b; border: 1px solid #475569; padding: 6px 12px;
            border-radius: 20px; font-size: 0.82em; font-weight: bold; color: #38bdf8;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
        }

        /* TAB FILTRI STATO */
        .status-tabs {
            background: #131c2e; padding: 8px 16px; border-bottom: 1px solid var(--border-col);
            display: flex; gap: 8px; flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
        }
        .status-tab {
            background: #0f172a; color: #94a3b8; border: 1px solid #334155;
            padding: 6px 14px; border-radius: 16px; font-weight: 700; font-size: 0.82em;
            cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px;
        }
        .status-tab.active {
            background: var(--primary); color: #fff; border-color: #60a5fa;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
        }
        .status-tab { flex: 1 1 auto; justify-content: center; }
        /* Telefono: le tre schede (Da Consegnare, Consegnate Oggi, Tutte) entrano tutte nello schermo */
        @media (max-width: 480px) {
            .status-tabs { padding: 8px 10px; gap: 6px; }
            .status-tab { padding: 6px 8px; font-size: 0.78em; white-space: normal; text-align: center; line-height: 1.15; min-width: 0; }
            .status-tab > i { display: none; }
        }

        /* LISTA CONSEGNE */
        .deliveries-container {
            flex: 1; overflow-y: auto; padding: 12px 12px 96px;   /* spazio per il pulsante SCANSIONA QR */
            display: flex; flex-direction: column; gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .delivery-card {
            background: var(--panel-bg); border: 1px solid var(--border-col);
            border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
            /* Nella lista che scorre le schede non devono schiacciarsi: con overflow hidden
               si stringevano per entrare nello schermo e nascondevano piatti e pulsanti */
            flex-shrink: 0;
        }
        .delivery-card.status-ready { border-left: 5px solid var(--ready); }
        .delivery-card.status-delivery { border-left: 5px solid var(--gold); background: #1a233a; }
        .delivery-card.status-done { border-left: 5px solid var(--free); opacity: 0.75; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .client-name { font-size: 1.15em; font-weight: 900; color: #fff; }
        .order-time { background: #0f172a; padding: 4px 8px; border-radius: 6px; font-size: 0.82em; font-weight: 800; color: var(--gold); border: 1px solid #334155; }

        .address-box {
            background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155;
            display: flex; flex-direction: column; gap: 4px;
        }
        .address-text { font-size: 1.05em; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
        .address-meta { font-size: 0.85em; color: #94a3b8; font-weight: bold; }

        .products-summary { font-size: 0.85em; color: #cbd5e1; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 8px; flex-wrap: wrap; }
        .order-total { font-size: 1.1em; font-weight: 900; color: var(--ready); }
        .driver-tag { font-size: 0.78em; background: #334155; color: #cbd5e1; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        .payment-tag { font-size: 0.75em; padding: 3px 8px; border-radius: 6px; font-weight: 800; }

        .actions-row { display: flex; gap: 8px; width: 100%; margin-top: 4px; }
        .btn-action {
            flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 900;
            font-size: 0.9em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .btn-maps { background: #0284c7; color: #fff; }
        .btn-call { background: #0d9488; color: #fff; flex: 0.6; }
        .btn-take { background: var(--gold); color: #000; }
        .btn-done { background: var(--free); color: #000; }
        .btn-release { background: none; border: none; color: #94a3b8; font-size: 0.78em; text-decoration: underline; cursor: pointer; padding: 6px 0 0; width: 100%; }
        .codice-ordine { font-size: 0.72em; color: #94a3b8; font-weight: 800; letter-spacing: 1px; margin-top: 4px; text-align: right; }

        /* PRESA IN CARICO CON IL QR DELLA BUSTA */
        .btn-scan-fab {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 900;
            background: var(--gold); color: #000; border: none; border-radius: 30px;
            padding: 14px 26px; font-weight: 900; font-size: 1.05em; display: none;
            align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); cursor: pointer; white-space: nowrap;
        }
        #scanner-overlay {
            position: fixed; inset: 0; z-index: 10000; background: #000; display: none;
            flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
        }
        .scanner-titolo { color: #fff; font-weight: 900; font-size: 1.15em; text-align: center; }
        .scanner-atteso { color: var(--gold); font-weight: 800; text-align: center; font-size: 0.95em; min-height: 1.2em; }
        .scanner-video-box { position: relative; width: min(86vw, 360px); aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden; background: #111; }
        .scanner-video-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .scanner-mirino { position: absolute; inset: 14%; border: 3px solid var(--gold); border-radius: 12px; box-shadow: 0 0 0 999px rgba(0,0,0,0.35); pointer-events: none; }
        .scanner-stato { color: #cbd5e1; font-size: 0.9em; text-align: center; min-height: 1.2em; max-width: 360px; }
        .btn-scanner { width: min(86vw, 360px); padding: 14px; border-radius: 12px; border: none; font-weight: 900; font-size: 1em; cursor: pointer; text-align: center; display: block; }
        .btn-scanner-foto { background: #334155; color: #fff; }
        .btn-scanner-chiudi { background: #ef4444; color: #fff; }

        /* LOGIN OVERLAY FATTORINO */
        #driver-login-overlay {
            position: fixed; inset: 0; background: rgba(11, 17, 32, 0.96);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center;
        }
        .login-card { background: var(--panel-bg); border: 1px solid var(--border-col); padding: 24px; border-radius: 16px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .login-input { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 10px; font-size: 1.1em; font-weight: bold; text-align: center; margin: 15px 0; outline: none; }
        .btn-login { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: 900; font-size: 1.1em; cursor: pointer; }

        .empty-state { text-align: center; padding: 50px 20px; color: #64748b; font-weight: bold; font-size: 1.05em; }
    </style>
</head>
<body>

    <!-- OVERLAY IDENTIFICAZIONE FATTORINO -->
    <div id="driver-login-overlay">
        <div class="login-card">
            <i class="fa-solid fa-motorcycle" style="font-size:3em; color:var(--gold); margin-bottom:12px;"></i>
            <h2 style="margin:0 0 8px 0; color:#fff;">ACCESSO FATTORINO</h2>
            <p style="color:#94a3b8; font-size:0.9em; margin:0 0 15px 0;">Inserisci il tuo PIN personale per iniziare il turno.</p>
            <input type="tel" id="driver-pin-input" class="login-input" placeholder="PIN" maxlength="4" inputmode="numeric" autocomplete="off" style="-webkit-text-security: disc; letter-spacing:6px;" oninput="this.value = this.value.replace(/[^0-9]/g, '')" onkeyup="if(event.key === 'Enter') accediConPin()">
            <button class="btn-login" id="btn-driver-login" onclick="accediConPin()">INIZIA TURNO</button>
        </div>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="brand-title">
            <i class="fa-solid fa-motorcycle" style="color:var(--gold);"></i> <span id="header-locale-title">DELIVERY</span>
        </div>
        <div class="ready-badge" id="badge-pronte" onclick="filtraStato('attive')" title="Consegne pronte da ritirare">
            🔔 <span id="count-pronte">0</span> <span id="label-pronte">pronte</span>
        </div>
        <div class="driver-badge" onclick="cambiaFattorino()" title="Fine turno / Cambia Fattorino">
            <i class="fa fa-user-circle"></i> <span id="current-driver-display">Rider</span>
        </div>
    </div>

    <!-- NOTIFICHE PUSH -->
    <div class="banner-notifiche" id="banner-notifiche">
        <span id="banner-notifiche-testo"></span>
        <button id="btn-notifiche" onclick="attivaNotifiche()">ATTIVA</button>
    </div>

    <!-- TAB FILTRI STATO -->
    <div class="status-tabs">
        <div class="status-tab active" id="tab-attive" onclick="filtraStato('attive')">
            <i class="fa fa-clock"></i> Da Consegnare <span id="count-attive" style="background:rgba(0,0,0,0.3); padding:1px 6px; border-radius:10px;">0</span>
        </div>
        <div class="status-tab" id="tab-consegnate" onclick="filtraStato('consegnate')">
            <i class="fa fa-check-circle"></i> Consegnate Oggi <span id="count-consegnate" style="background:rgba(0,0,0,0.3); padding:1px 6px; border-radius:10px;">0</span>
        </div>
        <div class="status-tab" id="tab-tutte" onclick="filtraStato('tutte')">
            <i class="fa fa-list"></i> Tutte
        </div>
    </div>

    <audio id="audio-ding" src="ding.mp3" preload="auto"></audio>

    <!-- LISTA CONSEGNE -->
    <div class="deliveries-container" id="deliveries-list"></div>

    <!-- PULSANTE SCANNER: il rider prende in carico la busta che ha in mano scansionando il QR dello scontrino -->
    <button class="btn-scan-fab" id="btn-scan-fab" onclick="window.apriScanner()"><i class="fa fa-qrcode"></i> SCANSIONA QR</button>

    <div id="scanner-overlay">
        <div class="scanner-titolo">📷 Inquadra il QR sullo scontrino</div>
        <div class="scanner-atteso" id="scanner-atteso"></div>
        <div class="scanner-video-box">
            <video id="scanner-video" playsinline muted autoplay></video>
            <div class="scanner-mirino"></div>
        </div>
        <div class="scanner-stato" id="scanner-stato"></div>
        <label class="btn-scanner btn-scanner-foto">📸 Fai una foto al QR
            <input type="file" id="scanner-foto" accept="image/*" capture="environment" style="display:none;" onchange="window.leggiFotoQr(this)">
        </label>
        <button class="btn-scanner btn-scanner-chiudi" onclick="window.chiudiScanner()">Chiudi</button>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection as _collection, doc as _doc, onSnapshot, updateDoc, getDoc, getDocs, setDoc, deleteDoc, query, where, serverTimestamp, runTransaction, deleteField } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";
        import { assicuraLoginDispositivo } from "./login-dispositivo.js";
        import { applicaLogoLocale } from "./logo-locale.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjNba4HvtDZpcoDfnXTOWysn_i1UFwPWU",
            authDomain: "gestionale-ristoranti-96c5b.firebaseapp.com",
            projectId: "gestionale-ristoranti-96c5b",
            storageBucket: "gestionale-ristoranti-96c5b.firebasestorage.app",
            messagingSenderId: "234695436534",
            appId: "1:234695436534:web:2d4cfc9ddbc1f1de9824d7"
        };

        const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- MULTI-TENANT ROUTER ---
        const _urlParams = new URLSearchParams(window.location.search);
        if (_urlParams.has('locale')) {
            window.TENANT_ID = _urlParams.get('locale') || 'default';
            localStorage.setItem('saas_tenant_id', window.TENANT_ID);
        } else {
            window.TENANT_ID = window.TENANT_ID || localStorage.getItem('saas_tenant_id') || 'default';
        }

        const collection = (database, ...pathSegments) => {
            if (window.TENANT_ID && window.TENANT_ID !== 'default' && pathSegments[0] !== 'ristoranti' && pathSegments[0] !== 'saas_clienti') {
                return _collection(database, 'ristoranti', window.TENANT_ID, ...pathSegments);
            }
            return _collection(database, ...pathSegments);
        };

        const doc = (database, ...pathSegments) => {
            if (window.TENANT_ID && window.TENANT_ID !== 'default' && pathSegments[0] !== 'ristoranti' && pathSegments[0] !== 'saas_clienti') {
                return _doc(database, 'ristoranti', window.TENANT_ID, ...pathSegments);
            }
            return _doc(database, ...pathSegments);
        };

        // Accesso del dispositivo con l'account del locale (una sola volta, poi Firebase lo ricorda)
        await assicuraLoginDispositivo({ titolo: "App Rider" });

        // Identità del fattorino: PIN personale creato in Cassa > Dipendenti con ruolo "Rider"
        let currentDriverId = localStorage.getItem('delivery_driver_id') || "";
        let currentDriver = currentDriverId ? (localStorage.getItem('delivery_driver_name') || "") : "";
        let filtroCorrente = 'attive';
        let ordiniCache = [];

        // Un ordine preso in carico è visibile solo al rider che lo ha preso
        const haRider = (o) => !!(o.fattorino_id || o.fattorino);
        const isMio = (o) => o.fattorino_id ? o.fattorino_id === currentDriverId : (!!currentDriver && o.fattorino === currentDriver);
        const presoDaAltri = (o) => haRider(o) && !isMio(o);

        // Avviso quando un ordine passa a "Pronto" in cucina: suono, vibrazione e messaggio
        const statiPrecedenti = new Map();   // id ordine -> stato in cucina all'aggiornamento precedente
        let primoCaricamento = true;
        let audioSbloccato = false;

        // I browser suonano solo dopo un tocco dell'utente: il primo tocco "sblocca" l'audio
        function sbloccaAudio() {
            if (audioSbloccato) return;
            const audio = document.getElementById('audio-ding');
            audio.muted = true;
            audio.play().then(() => { audio.pause(); audio.currentTime = 0; audio.muted = false; audioSbloccato = true; }).catch(() => { audio.muted = false; });
        }
        document.addEventListener('click', sbloccaAudio);
        document.addEventListener('touchstart', sbloccaAudio);

        // Avviso: pronto e non di un altro rider (anche se l'ho preso in carico prima che fosse pronto)
        const daAvvisare = (o) => o.stato === 'Pronto' && o.stato_consegna !== 'Consegnato' && !presoDaAltri(o);
        // Badge: pronto e non ancora preso in carico da nessuno
        const daRitirare = (o) => daAvvisare(o) && o.stato_consegna !== 'In consegna';

        function avvisaOrdiniPronti(pronti) {
            if (!currentDriver || pronti.length === 0) return;
            const audio = document.getElementById('audio-ding');
            try { audio.currentTime = 0; audio.play().catch(() => {}); } catch (e) {}
            if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300]);
            const o = pronti[0];
            const nome = `${o.cognome || ''} ${o.nome || ''}`.trim() || 'Cliente';
            Swal.fire({
                toast: true, position: 'top', icon: 'success', showConfirmButton: false, timer: 6000,
                titleText: pronti.length === 1 ? `🍕 Pronto da ritirare: ${nome}${o.orario ? ' · ore ' + o.orario : ''}` : `🍕 ${pronti.length} consegne pronte da ritirare`,
                background: '#14532d', color: '#fff'
            });
        }

        // Badge in alto e sull'icona dell'app (dove supportato) con le consegne pronte da ritirare
        function aggiornaBadgePronte() {
            const n = currentDriver ? ordiniCache.filter(o => o.stato !== 'Annullato' && daRitirare(o)).length : 0;
            document.getElementById('badge-pronte').style.display = n > 0 ? 'block' : 'none';
            document.getElementById('count-pronte').innerText = n;
            document.getElementById('label-pronte').innerText = n === 1 ? 'pronta' : 'pronte';
            document.title = n > 0 ? `(${n}) App Rider` : 'App Rider';
            document.getElementById('btn-scan-fab').style.display = currentDriver ? 'flex' : 'none';
            try { if (navigator.setAppBadge) (n > 0 ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch (e) {}
        }

        // --- NOTIFICHE PUSH: avviso "pronto" anche con l'app chiusa ---
        // Il telefono si iscrive in notifiche_rider/{token} col rider di turno; la notifica la manda
        // il server (functions/avvisi-rider.js) quando la cucina segna "Pronto". A fine turno si cancella.
        let tokenPush = localStorage.getItem('push_token') || "";

        async function pushSupportato() {
            try { return 'Notification' in window && 'serviceWorker' in navigator && await isSupported(); } catch (e) { return false; }
        }

        async function iscriviNotifiche() {
            const token = await getToken(getMessaging(app));
            if (tokenPush && tokenPush !== token) await deleteDoc(doc(db, "notifiche_rider", tokenPush)).catch(() => {});
            tokenPush = token;
            localStorage.setItem('push_token', token);
            await setDoc(doc(db, "notifiche_rider", token), { token, rider_id: currentDriverId, rider_nome: currentDriver, aggiornato: serverTimestamp() });
        }

        async function disiscriviNotifiche() {
            if (tokenPush) await deleteDoc(doc(db, "notifiche_rider", tokenPush)).catch(() => {});
        }

        async function aggiornaBannerNotifiche() {
            const banner = document.getElementById('banner-notifiche');
            const mostra = (testo, conPulsante) => {
                document.getElementById('banner-notifiche-testo').innerText = testo;
                document.getElementById('btn-notifiche').style.display = conPulsante ? '' : 'none';
                banner.style.display = 'flex';
            };
            banner.style.display = 'none';
            if (!currentDriver) return;
            if (!(await pushSupportato())) {
                // iPhone: le notifiche arrivano solo all'app aggiunta alla schermata Home
                if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone) {
                    mostra("📲 Per gli avvisi con l'app chiusa: tocca Condividi → «Aggiungi alla schermata Home» e apri l'App Rider da lì.", false);
                }
                return;
            }
            if (Notification.permission === 'granted') {
                iscriviNotifiche().catch(e => console.warn("Notifiche non attivate:", e));
            } else if (Notification.permission === 'denied') {
                mostra("🔕 Notifiche bloccate: abilitale per questo sito nelle impostazioni del browser.", false);
            } else {
                mostra("🔔 Ricevi l'avviso «Pronto» anche con l'app chiusa.", true);
            }
        }

        window.attivaNotifiche = async () => {
            try {
                if (await Notification.requestPermission() !== 'granted') return aggiornaBannerNotifiche();
                await iscriviNotifiche();
                document.getElementById('banner-notifiche').style.display = 'none';
                Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'Notifiche attive', showConfirmButton: false, timer: 2000 });
            } catch (e) {
                console.error(e);
                Swal.fire({ icon: 'error', title: 'Notifiche non attivate', text: e.message, background: '#1e293b', color: '#fff' });
            }
        };

        function getTodayLocal() {
            const d = new Date();
            return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        }

        window.accediConPin = async () => {
            const inputPin = document.getElementById('driver-pin-input');
            const pin = inputPin.value.trim();
            if (pin.length !== 4) return Swal.fire({ icon: 'warning', title: 'Inserisci il PIN di 4 cifre', background: '#1e293b', color: '#fff' });

            const btn = document.getElementById('btn-driver-login');
            btn.disabled = true;
            try {
                const snap = await getDocs(collection(db, "dipendenti"));
                let rider = null, pinNonRider = false;
                snap.forEach(d => {
                    const dip = d.data();
                    if (String(dip.pin).trim() !== pin) return;
                    if (dip.ruolo === 'rider') rider = { id: d.id, nome: dip.nome };
                    else pinNonRider = true;
                });

                if (!rider) {
                    inputPin.value = "";
                    return Swal.fire({
                        icon: 'error',
                        title: pinNonRider ? 'PIN non abilitato alle consegne' : 'PIN non trovato',
                        text: pinNonRider ? 'Chiedi in cassa di impostare il tuo ruolo su "Rider".' : 'Controlla il PIN o chiedi in cassa.',
                        background: '#1e293b', color: '#fff'
                    });
                }

                currentDriver = rider.nome;
                currentDriverId = rider.id;
                localStorage.setItem('delivery_driver_name', rider.nome);
                localStorage.setItem('delivery_driver_id', rider.id);
                inputPin.value = "";
                document.getElementById('current-driver-display').innerText = rider.nome;
                document.getElementById('driver-login-overlay').style.display = 'none';
                renderDeliveries();
                aggiornaBannerNotifiche();
                if (window.ordineDaLink) gestisciOrdineDaLink();
                else Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: `Buon turno, ${rider.nome}!`, showConfirmButton: false, timer: 1500 });
            } catch (e) {
                console.error(e);
                Swal.fire({ icon: 'error', title: 'Errore di connessione', text: 'Riprova tra qualche secondo.', background: '#1e293b', color: '#fff' });
            } finally {
                btn.disabled = false;
            }
        };

        window.cambiaFattorino = async () => {
            if (currentDriver) {
                const res = await Swal.fire({
                    title: 'Fine turno?',
                    text: `Esci come ${currentDriver}? Servirà il PIN per rientrare.`,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Esci',
                    cancelButtonText: 'Annulla',
                    background: '#1e293b', color: '#fff'
                });
                if (!res.isConfirmed) return;
            }
            // Fine turno: questo telefono non riceve più gli avvisi (senza aspettare: offline resterebbe fermo qui)
            disiscriviNotifiche();
            currentDriver = "";
            currentDriverId = "";
            localStorage.removeItem('delivery_driver_name');
            localStorage.removeItem('delivery_driver_id');
            document.getElementById('current-driver-display').innerText = 'Rider';
            document.getElementById('driver-login-overlay').style.display = 'flex';
            aggiornaBadgePronte();
            aggiornaBannerNotifiche();
            setTimeout(() => document.getElementById('driver-pin-input').focus(), 100);
        };

        window.filtraStato = (stato) => {
            filtroCorrente = stato;
            document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${stato}`).classList.add('active');
            renderDeliveries();
        };

        function initDelivery() {
            if (currentDriver) {
                document.getElementById('driver-login-overlay').style.display = 'none';
                document.getElementById('current-driver-display').innerText = currentDriver;
            }
            aggiornaBannerNotifiche();

            onSnapshot(doc(db, "impostazioni", "negozio"), (snap) => {
                if (snap.exists() && snap.data().nome) {
                    document.getElementById('header-locale-title').innerText = snap.data().nome.toUpperCase();
                }
                if (snap.exists()) applicaLogoLocale(snap.data().logo_url);
            });

            const today = getTodayLocal();
            const q = query(collection(db, "ordini"), where("tipo", "==", "DOMICILIO"), where("data_ritiro", "==", today));
            
            onSnapshot(q, (snap) => {
                ordiniCache = [];
                snap.forEach(d => ordiniCache.push({ id: d.id, ...d.data() }));
                // Al primo caricamento nessun avviso: solo gli ordini che diventano pronti da adesso in poi
                const nuoviPronti = primoCaricamento ? [] : ordiniCache.filter(o =>
                    o.stato !== 'Annullato' && daAvvisare(o) && statiPrecedenti.get(o.id) !== 'Pronto');
                statiPrecedenti.clear();
                ordiniCache.forEach(o => statiPrecedenti.set(o.id, o.stato));
                primoCaricamento = false;
                renderDeliveries();
                avvisaOrdiniPronti(nuoviPronti);
            });
        }

        window.renderDeliveries = () => {
            const container = document.getElementById('deliveries-list');
            if (!container) return;

            let countAttive = 0, countConsegnate = 0;
            const filtered = ordiniCache.filter(o => {
                if (o.stato === 'Annullato') return false;
                if (presoDaAltri(o)) return false;
                // Usa stato_consegna indipendente dallo stato fiscale della Cassa
                const isDone = o.stato_consegna === 'Consegnato';
                if (isDone) countConsegnate++;
                else countAttive++;

                if (filtroCorrente === 'attive') return !isDone;
                if (filtroCorrente === 'consegnate') return isDone;
                return true;
            });

            document.getElementById('count-attive').innerText = countAttive;
            document.getElementById('count-consegnate').innerText = countConsegnate;
            aggiornaBadgePronte();

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-mug-hot" style="font-size:2.5em; margin-bottom:10px; display:block; color:#475569;"></i>Nessuna consegna trovata in questa sezione.</div>`;
                return;
            }

            filtered.sort((a, b) => (a.orario || '00:00').localeCompare(b.orario || '00:00'));

            container.innerHTML = filtered.map(o => {
                const isDone = o.stato_consegna === 'Consegnato';
                const isInDelivery = o.stato_consegna === 'In consegna';
                const cardClass = isDone ? 'status-done' : (isInDelivery ? 'status-delivery' : 'status-ready');
                
                const esc = window.escapeHtml;
                const nomeCompleto = `${o.cognome || ''} ${o.nome || ''}`.trim() || 'Cliente';
                const prodottiStr = (o.prodotti || []).map(p => `${esc(p.qta)}x ${esc(p.nome)}`).join(' • ');
                const capOrdine = o.cap || o.cliente?.cap || '';
                const indirizzoCompleto = `${o.indirizzo || 'Indirizzo non specificato'}${capOrdine ? ', ' + capOrdine : ''} ${o.zona ? '(' + o.zona + ')' : ''}`;
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([o.indirizzo || '', capOrdine].filter(Boolean).join(', '))}`;
                const telUrl = `tel:${String(o.telefono || '').replace(/[^\d+]/g, '')}`;

                // Indica al fattorino se lo scontrino è già stato battuto/chiuso in cassa
                const scontrinoBattuto = (o.stato === 'Consegnato' || o.metodo_pagamento);
                // Stato in cucina, per sapere se passare a ritirare
                const statoCucina = isDone ? null : ({
                    'In attesa': ['⏳ In attesa', '#334155', '#cbd5e1'],
                    'Prenotato': ['⏳ In attesa', '#334155', '#cbd5e1'],
                    'In forno': ['🔥 In preparazione', '#7c2d12', '#fdba74'],
                    'Pronto': ['✅ PRONTO', '#166534', '#bbf7d0']
                })[o.stato];
                const badgeCucina = statoCucina ? `<span class="kitchen-tag" style="background:${statoCucina[1]}; color:${statoCucina[2]};">${statoCucina[0]}</span>` : '';
                const badgePagamento = scontrinoBattuto
                    ? `<span class="payment-tag" style="background:#065f46; color:#6ee7b7;">🧾 Scontrino Emesso ${o.metodo_pagamento ? '(' + esc(o.metodo_pagamento) + ')' : ''}</span>`
                    : `<span class="payment-tag" style="background:#7c2d12; color:#fdba74;">💶 Da Chiudere in Cassa</span>`;

                return `
                    <div class="delivery-card ${cardClass}">
                        <div class="card-header">
                            <div>
                                <div class="client-name">${esc(nomeCompleto.toUpperCase())}</div>
                                <div style="font-size:0.82em; color:#94a3b8; font-weight:bold;">${esc(o.telefono || 'Nessun telefono')}</div>
                            </div>
                            <div>
                                <div class="order-time"><i class="fa fa-clock"></i> ${esc(o.orario || '--:--')}</div>
                                <div class="codice-ordine">#${esc(codiceBreve(o.id))}</div>
                            </div>
                        </div>

                        <div class="address-box">
                            <div class="address-text">
                                <i class="fa-solid fa-location-dot" style="color:#f87171;"></i>
                                <span style="flex:1;">${esc(indirizzoCompleto)}</span>
                            </div>
                            ${o.citofono ? `<div class="address-meta">🔔 Citofono / Scala: <b>${esc(o.citofono)}</b></div>` : ''}
                        </div>

                        <div class="products-summary">
                            🍕 <b>Piatti:</b> ${prodottiStr || 'Nessun dettaglio'}
                            ${o.note_ordine ? `<div style="margin-top:4px; color:#fbbf24;">📝 Note: ${esc(o.note_ordine)}</div>` : ''}
                        </div>

                        <div class="card-footer">
                            <div class="order-total">Totale: €${parseFloat(o.totale || 0).toFixed(2)}</div>
                            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                                ${badgeCucina}
                                ${badgePagamento}
                                ${o.fattorino ? `<span class="driver-tag">🛵 ${esc(o.fattorino)}</span>` : ''}
                            </div>
                        </div>

                        <div class="actions-row">
                            <a href="${esc(mapsUrl)}" target="_blank" class="btn-action btn-maps" style="text-decoration:none;">
                                <i class="fa fa-map-location-dot"></i> Maps
                            </a>
                            <a href="${esc(telUrl)}" class="btn-action btn-call" style="text-decoration:none;">
                                <i class="fa fa-phone"></i> Chiama
                            </a>
                            ${!isDone ? `
                                ${!isInDelivery ? `
                                    <button class="btn-action btn-take" onclick="window.apriScanner('${window.safeId(o.id)}')">
                                        <i class="fa fa-qrcode"></i> Scansiona e prendi
                                    </button>
                                ` : `
                                    <button class="btn-action btn-done" onclick="window.segnaConsegnato('${window.safeId(o.id)}')">
                                        <i class="fa fa-check"></i> Consegnato
                                    </button>
                                `}
                            ` : `
                                <div style="flex:1; text-align:center; color:#10b981; font-weight:bold; font-size:0.85em;">
                                    <i class="fa fa-circle-check"></i> Consegna Completata
                                </div>
                            `}
                        </div>
                        ${!isDone && !isInDelivery ? `
                            <button class="btn-release" onclick="window.prendiSenzaQr('${window.safeId(o.id)}')">
                                Scontrino senza QR? Prendi a mano
                            </button>
                        ` : ''}
                        ${isInDelivery && isMio(o) ? `
                            <button class="btn-release" onclick="window.rilasciaOrdine('${window.safeId(o.id)}')">
                                <i class="fa fa-rotate-left"></i> Presa per errore? Rilascia l'ordine agli altri rider
                            </button>
                        ` : ''}
                    </div>
                `;
            }).join('');
        };

        // Presa in carico in una transazione: se due rider ci provano insieme vince il primo.
        // Restituisce { codice, ordine } con codice: ok, gia-tuo, altro, consegnato, annullato,
        // non-domicilio, inesistente, offline
        async function eseguiPresaInCarico(docId) {
            const ref = doc(db, "ordini", docId);
            const esito = { codice: 'ok', ordine: null };
            try {
                await runTransaction(db, async (tx) => {
                    const snap = await tx.get(ref);
                    if (!snap.exists()) { esito.codice = 'inesistente'; return; }
                    const o = snap.data();
                    esito.ordine = { id: docId, ...o };
                    if (o.stato === 'Annullato') { esito.codice = 'annullato'; return; }
                    if (o.tipo !== 'DOMICILIO' && !String(o.indirizzo || '').trim()) { esito.codice = 'non-domicilio'; return; }
                    if (o.stato_consegna === 'Consegnato') { esito.codice = 'consegnato'; return; }
                    if (presoDaAltri(o)) { esito.codice = 'altro'; return; }
                    if (isMio(o) && o.stato_consegna) { esito.codice = 'gia-tuo'; return; }
                    tx.update(ref, {
                        stato_consegna: "In consegna",
                        fattorino: currentDriver,
                        fattorino_id: currentDriverId,
                        timestamp_consegna_avvio: serverTimestamp()
                    });
                });
            } catch (e) {
                console.error(e);
                esito.codice = 'offline';
            }
            return esito;
        }

        const nomeOrdine = (o) => (o ? `${o.cognome || ''} ${o.nome || ''}`.trim().toUpperCase() : '') || 'CLIENTE';
        const codiceBreve = (id) => String(id || '').slice(-6).toUpperCase();
        const dialogo = { background: '#1e293b', color: '#fff' };

        function mostraEsitoPresa(esito, conQr) {
            const o = esito.ordine;
            switch (esito.codice) {
                case 'ok':
                    if (!conQr) return Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Ordine preso in carico!', showConfirmButton: false, timer: 1400 });
                    return Swal.fire({ icon: 'success', title: 'Preso in carico!', timer: 2600, showConfirmButton: false, ...dialogo,
                        html: `<b style="font-size:1.2em;">${window.escapeHtml(nomeOrdine(o))}</b><br>${window.escapeHtml(o.indirizzo || '')}<br><small>Ordine #${window.escapeHtml(codiceBreve(o.id))}</small>` });
                case 'gia-tuo':
                    return Swal.fire({ icon: 'info', title: 'È già tuo', text: `L'ordine di ${nomeOrdine(o)} è già in carico a te.`, ...dialogo });
                case 'altro':
                    return Swal.fire({ icon: 'info', title: 'Ordine già preso', text: `Lo ha appena preso in carico ${o.fattorino || 'un altro rider'}.`, ...dialogo });
                case 'consegnato':
                    return Swal.fire({ icon: 'info', title: 'Ordine già consegnato', text: `L'ordine di ${nomeOrdine(o)} risulta già consegnato.`, ...dialogo });
                case 'annullato':
                    return Swal.fire({ icon: 'error', title: 'Ordine annullato', text: `L'ordine di ${nomeOrdine(o)} è stato annullato: chiedi in cassa.`, ...dialogo });
                case 'non-domicilio':
                    return Swal.fire({ icon: 'error', title: 'Non è una consegna', text: 'Questo ordine non è a domicilio.', ...dialogo });
                case 'inesistente':
                    return Swal.fire({ icon: 'error', title: 'Ordine non preso in carico', text: "L'ordine non esiste più (eliminato).", ...dialogo });
                default:
                    return Swal.fire({ icon: 'error', title: 'Ordine non preso in carico', text: 'Serve la connessione internet per prendere un ordine. Riprova.', ...dialogo });
            }
        }

        window.assegnaFattorino = async (docId) => {
            if (!currentDriver) return window.cambiaFattorino();
            mostraEsitoPresa(await eseguiPresaInCarico(docId), false);
        };

        // Uscita di emergenza se lo scontrino non ha il QR (stampante spenta, carta strappata...)
        window.prendiSenzaQr = async (docId) => {
            if (!currentDriver) return window.cambiaFattorino();
            const o = ordiniCache.find(x => x.id === docId);
            const res = await Swal.fire({
                icon: 'warning', title: 'Prendere senza QR?', showCancelButton: true,
                confirmButtonText: 'Sì, è la mia busta', cancelButtonText: 'Annulla', ...dialogo,
                html: `Controlla che sulla busta ci sia <b>${window.escapeHtml(nomeOrdine(o))}</b><br>${window.escapeHtml(o?.indirizzo || '')}`
            });
            if (res.isConfirmed) await window.assegnaFattorino(docId);
        };

        // --- SCANNER QR ---
        // Sugli scontrini delle consegne la cassa stampa un QR con il link
        // delivery.html?locale=...&ordine=ID: il rider prende in carico proprio la busta che ha in mano.
        const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
        const scanner = { stream: null, attivo: false, idAtteso: null, timer: null, detector: null, canvas: null };

        function caricaJsQR() {
            if (window.jsQR) return Promise.resolve(window.jsQR);
            if (!caricaJsQR.promessa) {
                caricaJsQR.promessa = new Promise((ok, ko) => {
                    const script = document.createElement('script');
                    script.src = JSQR_URL;
                    script.onload = () => ok(window.jsQR);
                    script.onerror = () => { caricaJsQR.promessa = null; ko(new Error('jsQR non caricato')); };
                    document.head.appendChild(script);
                });
            }
            return caricaJsQR.promessa;
        }

        // Dal testo del QR all'ID dell'ordine
        function idOrdineDaQr(testo) {
            testo = String(testo || '').trim();
            let url = null;
            try { url = new URL(testo); } catch (e) { /* non è un link */ }
            if (!url) return /^[A-Za-z0-9]{6,40}$/.test(testo) ? { id: testo } : { errore: 'Questo QR non è di una consegna.' };
            const id = url.searchParams.get('ordine');
            if (!id) return { errore: 'Questo QR non è di una consegna.' };
            if ((url.searchParams.get('locale') || 'default') !== (window.TENANT_ID || 'default')) return { errore: 'Questo QR è di un altro locale.' };
            return { id };
        }

        // Legge un QR da video, foto o immagine: lettore nativo del telefono se c'è, altrimenti jsQR
        async function decodificaQr(sorgente, larghezza, altezza, accurata) {
            if (scanner.detector) {
                try {
                    const trovati = await scanner.detector.detect(sorgente);
                    if (trovati.length) return trovati[0].rawValue;
                } catch (e) { /* si prova con jsQR */ }
            }
            const jsQR = await caricaJsQR();
            const scala = Math.min(1, (accurata ? 1600 : 720) / Math.max(larghezza, altezza));
            const w = Math.max(1, Math.round(larghezza * scala)), h = Math.max(1, Math.round(altezza * scala));
            scanner.canvas = scanner.canvas || document.createElement('canvas');
            scanner.canvas.width = w; scanner.canvas.height = h;
            const ctx = scanner.canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(sorgente, 0, 0, w, h);
            const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: accurata ? 'attemptBoth' : 'dontInvert' });
            return r ? r.data : null;
        }

        const statoScanner = (testo) => { document.getElementById('scanner-stato').innerText = testo; };

        window.apriScanner = async (idAtteso = null) => {
            if (!currentDriver) return window.cambiaFattorino();
            scanner.idAtteso = idAtteso;
            const atteso = idAtteso ? ordiniCache.find(o => o.id === idAtteso) : null;
            document.getElementById('scanner-atteso').innerText = atteso ? `Busta di ${nomeOrdine(atteso)} · #${codiceBreve(atteso.id)}` : '';
            document.getElementById('scanner-overlay').style.display = 'flex';
            statoScanner('Avvio fotocamera...');
            caricaJsQR().catch(() => {});
            if (!scanner.detector && 'BarcodeDetector' in window) {
                try {
                    const formati = await window.BarcodeDetector.getSupportedFormats();
                    if (formati.includes('qr_code')) scanner.detector = new window.BarcodeDetector({ formats: ['qr_code'] });
                } catch (e) { /* lettore nativo non disponibile */ }
            }
            try {
                scanner.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
            } catch (e) {
                console.warn('Fotocamera:', e);
                return statoScanner('Fotocamera non disponibile qui: usa "Fai una foto al QR".');
            }
            if (document.getElementById('scanner-overlay').style.display === 'none') return window.chiudiScanner();
            const video = document.getElementById('scanner-video');
            video.srcObject = scanner.stream;
            try { await video.play(); } catch (e) { /* parte comunque con autoplay */ }
            scanner.attivo = true;
            statoScanner('Avvicina il QR al riquadro giallo');
            cicloScanner();
        };

        async function cicloScanner() {
            if (!scanner.attivo) return;
            const video = document.getElementById('scanner-video');
            if (video.readyState >= 2 && video.videoWidth) {
                let testo = null;
                try {
                    testo = await decodificaQr(video, video.videoWidth, video.videoHeight, false);
                } catch (e) {
                    // lettore QR non scaricato (connessione assente): riprova con calma
                    statoScanner('Lettore QR non disponibile: controlla la connessione.');
                    scanner.timer = setTimeout(cicloScanner, 2000);
                    return;
                }
                if (testo && scanner.attivo) return qrLetto(testo);
            }
            scanner.timer = setTimeout(cicloScanner, 150);
        }

        window.chiudiScanner = () => {
            scanner.attivo = false;
            clearTimeout(scanner.timer);
            if (scanner.stream) scanner.stream.getTracks().forEach(t => t.stop());
            scanner.stream = null;
            document.getElementById('scanner-video').srcObject = null;
            document.getElementById('scanner-overlay').style.display = 'none';
        };
        // App in secondo piano: la fotocamera si spegne
        document.addEventListener('visibilitychange', () => { if (document.hidden && scanner.stream) window.chiudiScanner(); });

        window.leggiFotoQr = async (input) => {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            statoScanner('Lettura della foto...');
            try {
                const url = URL.createObjectURL(file);
                const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
                const testo = await decodificaQr(img, img.naturalWidth, img.naturalHeight, true);
                URL.revokeObjectURL(url);
                if (testo) return qrLetto(testo);
                statoScanner('QR non trovato nella foto: riprova più vicino e con più luce.');
            } catch (e) {
                console.warn('Foto QR:', e);
                statoScanner('Foto non leggibile, riprova.');
            }
        };

        async function qrLetto(testo) {
            const idAtteso = scanner.idAtteso;
            window.chiudiScanner();
            if (navigator.vibrate) navigator.vibrate(120);
            const letto = idOrdineDaQr(testo);
            if (letto.errore) return Swal.fire({ icon: 'error', title: 'QR non valido', text: letto.errore, ...dialogo });
            await prendiInCaricoDaQr(letto.id, idAtteso);
        }

        async function prendiInCaricoDaQr(id, idAtteso) {
            if (idAtteso && id !== idAtteso) {
                const scansionato = ordiniCache.find(o => o.id === id);
                const atteso = ordiniCache.find(o => o.id === idAtteso);
                const res = await Swal.fire({
                    icon: 'warning', title: 'Busta diversa!', showCancelButton: true,
                    confirmButtonText: 'Prendo quella che ho in mano', cancelButtonText: 'Annulla', ...dialogo,
                    html: `Hai scansionato la busta di <b>${window.escapeHtml(scansionato ? nomeOrdine(scansionato) : 'un altro ordine')}</b>, non quella di <b>${window.escapeHtml(nomeOrdine(atteso))}</b>.`
                });
                if (!res.isConfirmed) return;
            }
            mostraEsitoPresa(await eseguiPresaInCarico(id), true);
        }

        // Link del QR aperto con la fotocamera del telefono: dopo l'accesso chiede conferma e prende in carico
        window.ordineDaLink = _urlParams.get('ordine');
        if (window.ordineDaLink) {
            const pulito = new URL(location.href);
            pulito.searchParams.delete('ordine');
            history.replaceState(null, '', pulito.pathname + pulito.search);
        }
        async function gestisciOrdineDaLink() {
            const id = window.ordineDaLink;
            if (!id || !currentDriver) return;
            window.ordineDaLink = null;
            let o = null;
            try { const snap = await getDoc(doc(db, "ordini", id)); o = snap.exists() ? { id, ...snap.data() } : null; } catch (e) { /* gestito sotto */ }
            const res = await Swal.fire({
                icon: 'question', title: 'Prendere in carico?', showCancelButton: true,
                confirmButtonText: 'Sì, prendo', cancelButtonText: 'No', ...dialogo,
                html: o ? `<b>${window.escapeHtml(nomeOrdine(o))}</b><br>${window.escapeHtml(o.indirizzo || '')}<br><small>Ordine #${window.escapeHtml(codiceBreve(id))}</small>` : 'Ordine del QR scansionato.'
            });
            if (res.isConfirmed) mostraEsitoPresa(await eseguiPresaInCarico(id), true);
        }

        window.rilasciaOrdine = async (docId) => {
            const o = ordiniCache.find(x => x.id === docId);
            if (!o || !isMio(o) || o.stato_consegna !== 'In consegna') return;
            const res = await Swal.fire({
                title: "Rilasciare l'ordine?",
                text: 'Tornerà visibile a tutti i rider come "da consegnare".',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sì, rilascia',
                cancelButtonText: 'Annulla',
                background: '#1e293b', color: '#fff'
            });
            if (!res.isConfirmed) return;
            await updateDoc(doc(db, "ordini", docId), {
                stato_consegna: deleteField(),
                fattorino: deleteField(),
                fattorino_id: deleteField(),
                timestamp_consegna_avvio: deleteField()
            });
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Ordine rilasciato', showConfirmButton: false, timer: 1400 });
        };

        window.segnaConsegnato = async (docId) => {
            const ordine = ordiniCache.find(x => x.id === docId);
            if (!currentDriver) return window.cambiaFattorino();
            if (ordine && presoDaAltri(ordine)) {
                return Swal.fire({ icon: 'info', title: 'Ordine di un altro rider', text: `Questo ordine è in carico a ${ordine.fattorino || 'un altro rider'}.`, background: '#1e293b', color: '#fff' });
            }
            const res = await Swal.fire({
                title: 'Confermare consegna?',
                text: "L'ordine verrà segnato come Consegnato al cliente.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                confirmButtonText: 'Sì, Consegnato',
                cancelButtonText: 'Annulla',
                background: '#1e293b', color: '#fff'
            });

            if (res.isConfirmed) {
                await updateDoc(doc(db, "ordini", docId), {
                    stato_consegna: "Consegnato",
                    fattorino: currentDriver,
                    fattorino_id: currentDriverId,
                    timestamp_consegna_fine: serverTimestamp()
                });
                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Consegnato con successo!', showConfirmButton: false, timer: 1400 });
            }
        };

        initDelivery();
        gestisciOrdineDaLink();
    </script>
</body>
</html>
