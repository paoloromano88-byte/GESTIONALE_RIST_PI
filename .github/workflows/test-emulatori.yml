# Test riutilizzabili con gli emulatori Firebase: regole Firestore + Cloud Functions
name: Test emulatori

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dipendenze
        run: |
          npm install --no-save --no-audit --no-fund firebase-tools@13.29.1 @firebase/rules-unit-testing@3.0.4 firebase@10.7.1
          (cd functions && npm ci --no-audit --no-fund)
          cp zone-consegna.js functions/zone-consegna.js
      - name: Regole Firestore
        run: npx firebase emulators:exec --only firestore --project demo-gestionale "node test/regole-firestore.test.mjs"
      - name: Elaborazione ordini (server)
        run: npx firebase emulators:exec --only firestore --project demo-gestionale "node functions/test/ordini.test.mjs"
      - name: Trigger Cloud Functions end-to-end
        run: npx firebase emulators:exec --only functions,firestore --project demo-gestionale "node functions/test/trigger.test.mjs"
