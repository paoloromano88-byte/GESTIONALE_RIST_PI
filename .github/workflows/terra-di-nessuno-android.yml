# Terra di Nessuno (cartella terra-di-nessuno/): prova le regole del gioco e compila l'app Android (APK di prova).
# L'APK si scarica dalla pagina dell'esecuzione, in fondo, alla voce "Artifacts" (terra-di-nessuno-apk).
name: Gioco Terra di Nessuno (Android)

on:
  push:
    paths:
      - 'terra-di-nessuno/**'
      - '.github/workflows/terra-di-nessuno-android.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: terra-di-nessuno
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terra-di-nessuno/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dipendenze
        run: npm ci --no-audit --no-fund
      - name: Test delle regole del gioco
        run: npm test
      - name: Build web e copia nel progetto Android
        run: npm run build && npx cap sync android
      - name: APK di prova
        working-directory: terra-di-nessuno/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: terra-di-nessuno-apk
          path: terra-di-nessuno/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
