<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#121212">
    <title>Pagina non trovata</title>
    <!-- Percorsi assoluti: Firebase mostra questa pagina per qualunque indirizzo inesistente, anche in sottocartelle -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <style>
        :root {
            --col-gold: #ffb300;
            --col-bg-body: #121212;
            --col-bg-card: #1e1e1e;
            --col-border: #444;
            --col-text-main: #eeeeee;
            --col-text-muted: #b0b0b0;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; padding: 20px;
            display: flex; align-items: center; justify-content: center;
            background: var(--col-bg-body); color: var(--col-text-main);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .scheda {
            width: 100%; max-width: 400px; padding: 32px 24px; text-align: center;
            background: var(--col-bg-card); border: 1px solid var(--col-border); border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .scheda img { width: 72px; height: 72px; border-radius: 16px; }
        .codice { margin: 18px 0 4px; color: var(--col-gold); font-size: 2.6em; font-weight: 800; letter-spacing: 2px; }
        h1 { margin: 0 0 12px; font-size: 1.35em; font-weight: 700; }
        p { margin: 0 0 24px; color: var(--col-text-muted); line-height: 1.5; }
        a.torna {
            display: block; padding: 16px; border-radius: 10px;
            background: var(--col-gold); color: #000; font-weight: 800; text-decoration: none;
        }
        a.torna:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
</head>
<body>
    <main class="scheda">
        <img src="/logo.png" alt="">
        <div class="codice">404</div>
        <h1>Pagina non trovata</h1>
        <p>L'indirizzo che hai aperto non esiste. Controlla di averlo scritto bene, oppure torna all'inizio.</p>
        <a class="torna" id="torna" href="/">TORNA ALL'INIZIO</a>
    </main>
    <script>
        // Se l'indirizzo sbagliato era di un locale (?locale=...), si torna all'inizio dello stesso locale
        try {
            var locale = new URLSearchParams(location.search).get('locale');
            if (locale) document.getElementById('torna').href = '/?locale=' + encodeURIComponent(locale);
        } catch (e) { /* resta "/" */ }
    </script>
</body>
</html>
